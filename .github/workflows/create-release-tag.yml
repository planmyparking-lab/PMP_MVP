name: Create release tag

# D6 / OQ-68: GitHub Rulesets on this personal-account repository can only restrict tag creation by role or team,
# never by named individual (no Teams exist here, and no assignable role sits between Write and Admin). This
# workflow is the recommended way to create a v* tag, gated by the `release-approval` environment's required
# reviewers (Afzal, Akanksha — named individually, which Environments support even though Rulesets don't). OQ-68
# is still open: no ruleset actually blocks a direct `git push origin v1.2.3` by anyone with write access (the
# Integration-bypass approach needed to build one was rejected by the API — an Organization-only feature), so this
# is a team-discipline norm, not an enforced one. The PAT below (OQ-71) needs only ordinary write access for the
# same reason; it does not need to belong to a bypass actor, because there is no such ruleset to bypass.
#
# OQ-71: the tag push below authenticates with the release-approval environment's own RELEASE_TAG_PAT, not the
# default GITHUB_TOKEN. GitHub does not re-trigger other workflows for a push authored by GITHUB_TOKEN (its own
# anti-recursion rule, confirmed 27 Nov 2026: deploy-prod.yml never ran after this workflow pushed v0.0.0-test with
# the default token), so deploy-prod.yml's `on: push: tags: ["v*"]` would otherwise never fire from here at all.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (vMAJOR.MINOR.PATCH[-pre]), e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Runs with no approval and no secrets: a malformed request is rejected before anyone is asked to approve it.
  validate:
    name: validate-tag
    runs-on: ubuntu-latest
    steps:
      - name: Must be requested against main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this from main, not ${{ github.ref }} — a release tag is always the tip of main (docs/release.md)."
          exit 1
      - name: Tag must match vMAJOR.MINOR.PATCH[-pre]
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' || {
            echo "::error::'$TAG' does not match vMAJOR.MINOR.PATCH[-pre] (scripts/deploy-preflight.mjs isReleaseTag)."
            exit 1
          }

  # The approval gate: pauses here for one of release-approval's named reviewers before anything below runs.
  create-tag:
    name: create-tag
    needs: validate
    environment: release-approval
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: RELEASE_TAG_PAT must be set
        env:
          # The secrets context cannot be used directly in a step `if:` (GitHub Actions rejects the whole workflow
          # file as invalid if it is); map it through env and check in the script instead.
          PAT: ${{ secrets.RELEASE_TAG_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::release-approval environment secret RELEASE_TAG_PAT is not set, so a pushed tag would never trigger deploy-prod.yml (OQ-71). Fine-grained PAT, Contents: Read and write, scoped to only this repository."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 1
          # A PAT, not the default GITHUB_TOKEN: see the OQ-71 note above the `on:` trigger.
          token: ${{ secrets.RELEASE_TAG_PAT }}
      - name: Tag must not already exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::$TAG already exists on origin."
            exit 1
          fi
      - name: Create and push the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG, approved via release-approval environment (run ${{ github.run_id }})"
          git push origin "refs/tags/$TAG"

name: Deploy staging

# CLD-09 / REL-01 release process: a merge to `main` deploys staging, after CI has passed for that commit.
# Database only for now: the Console deploy, Edge Functions and the post-deploy health check need setup that does not
# exist yet (docs/development/deployment.md). Nothing runs until an administrator sets the repository variable
# DEPLOY_ENABLED to "true" after the `staging` environment and its settings exist (CLD-01).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Two deploys never overlap; a queued deploy waits instead of cancelling the one in progress (CLD-09 X1).
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-staging
    # Only a successful CI run for a push to main in this repository; never a pull request (a fork's branch can also
    # be named main) and never a failed or cancelled run.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      # Deploy exactly the commit CI tested, not whatever main points at now.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Preflight (fails with the missing setting names, never values)
        run: node scripts/deploy-preflight.mjs --environment staging
      - name: Link the staging Supabase project
        id: link
        run: npx --yes supabase@2.122.0 link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Pending migrations (dry run)
        run: npx --yes supabase@2.122.0 db push --dry-run
      - name: Apply migrations
        run: npx --yes supabase@2.122.0 db push
      - name: Record the migration list in the job summary
        if: always() && steps.link.outcome == 'success'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }} # passed via env, never interpolated into the script
        run: |
          {
            echo "### Staging deploy of $HEAD_SHA"
            echo '```'
            npx --yes supabase@2.122.0 migration list || echo "migration list unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post-deploy health check (public, data-free — CLD-10)
        if: vars.CONSOLE_URL != ''
        env:
          CONSOLE_URL: ${{ vars.CONSOLE_URL }}
        run: |
          # /api/health answers only {"status": "ok"|"unconfigured"|"unavailable"} with no data (apps/console/src/lib/health.ts).
          # This only confirms the Console that's already live can still reach its database after this deploy's
          # migrations; it never gates whether the migrations themselves were applied (the steps above already did that).
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$CONSOLE_URL/api/health")
          cat /tmp/health.json
          if [ "$code" != "200" ]; then
            echo "::error::Console health check returned HTTP $code after this deploy ($CONSOLE_URL/api/health)"
            exit 1
          fi

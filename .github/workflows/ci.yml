name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only read the repository. No secrets are used, so PRs from forks are safe
# (this workflow uses `pull_request`, never `pull_request_target`).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24.11"
      - name: Scan repository for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir --redact --no-banner --exit-code 1 .

  # Required check name: "check"
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (version from package.json "packageManager")
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:repo
      - run: pnpm check:migrations
      - run: pnpm test:scripts
      - run: pnpm test:pilot # CON-12 ROI calculator and MET-01 to MET-03 metric tests
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build # console production build
      # T-CLD-01-N1: no service-role key material in the Console's client chunks or prerendered pages.
      - run: pnpm check:bundles console

  # Required check name: "db-tests". Plain PostgreSQL 16 + pgTAP with a minimal Supabase stub (scripts/ci-supabase-stub.sql):
  # applies every migration and runs supabase/tests plus the two-connection concurrency test. The stub implements
  # auth.uid()/auth.jwt()/auth.role() to match the real Supabase definitions; the real local stack (`pnpm test:db`,
  # Docker) stays the authority for anything needing other Supabase internals (storage, realtime, Edge Functions).
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install PostgreSQL 16 and pgTAP
        # Installed from the PGDG apt repo, not the runner image's default Ubuntu repos: Ubuntu's own package set
        # (and the versions it offers under postgresql-16/postgresql-16-pgtap) depends on the runner image's Ubuntu
        # release and has silently broken this step before when the image moved to a newer release that dropped
        # those exact package names. PGDG's repo always carries postgresql-16 regardless of the host OS release.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-16-pgtap
          # The package's postinst normally creates and starts the default cluster itself, but on this runner that
          # step is skipped (deferred service restarts: "No containers need to be restarted" / no systemd session),
          # so pg_ctlcluster has nothing to start. Create it explicitly rather than relying on the postinst hook.
          if ! pg_lsclusters | grep -q '^16 *main'; then sudo pg_createcluster 16 main; fi
          sudo pg_ctlcluster 16 main start
          # postgresql-common picks the next free port when 5432 is already taken on the runner image (observed:
          # it lands on 5433), so read back whatever port this cluster actually got rather than assuming 5432, and
          # export it for every later step (createuser here, then scripts/test-db-ci.mjs) through the standard
          # libpq PGPORT variable both already honour.
          echo "PGPORT=$(pg_lsclusters | awk '$1 == "16" && $2 == "main" { print $3 }')" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          sudo -u postgres createuser --superuser "$USER" -p "$PGPORT"
      - name: Apply migrations and run the SQL tests
        run: node scripts/test-db-ci.mjs # CI and GITHUB_ACTIONS are both set true by the runner; the script refuses to run without both

  # Verifies the Android JS bundle resolves (Metro). Does not build an APK or run on a device.
  android-bundle:
    name: android-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pmp/gate run bundle:android
      # T-CLD-01-N1: no service-role key material in the gate app's Android bundle.
      - run: pnpm check:bundles gate

  # Required check name: "branch-name" (pull requests only)
  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate head branch name
        env:
          HEAD_REF: ${{ github.head_ref }} # passed via env, never interpolated into the script
        run: node scripts/check-branch-name.mjs "$HEAD_REF"

  # Advisory (not in the required list): new advisories can appear without any code change.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 1247710 / GHSA-fc5q-39xc-vjpf / CVE-2026-112366: picomatch ReDoS via a single-branch repeated extglob.
      # No patched version exists on npm as of this ignore (latest published is 4.0.7, still vulnerable); the fix is
      # merged upstream (micromatch/picomatch#194) but unreleased. Remove this --ignore once a patched version ships
      # and the dependency is bumped — re-check with `pnpm audit` (no --ignore) first to confirm it's actually fixed.
      - run: pnpm audit --ignore 1247710
